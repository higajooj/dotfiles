# Yank + put the files on the system clipboard as a URI list (browsers etc.)
[[mgr.prepend_keymap]]
on   = "y"
desc = "Yank files and copy them to the system clipboard"
run  = [
  '''shell -- set -- %s; [ $# -gt 0 ] && for p in "$@"; do echo "file://$(printf '%%s' "$p" | sed 's/ /%%20/g')"; done | wl-copy --type text/uri-list && notify-send -t 1500 "Yazi" "Copied $# file(s)"''',
  "yank",
]

[[mgr.prepend_keymap]]
on  = "!"
run = [ "shell -- notify-send \"$(md5sum $1 | awk '{print $1}')\"" ]
desc = "Calculate MD5 checksum of selected file"
